version: '3.8'

services:

  # --- Kafka stack ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # --- Producer: Wikimedia recent-changes stream -> Kafka ---
  producer:
    build: ./producer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: raw_wiki_changes
      WIKI_STREAM_URL: https://stream.wikimedia.org/v2/stream/recentchange
      WIKI_FILTER: enwiki
      TYPE_FILTER: edit,new
      EXCLUDE_BOTS: "true"
    restart: unless-stopped

  # --- Spark (Structured Streaming consumer) ---
  spark-consumer:
    build: ./spark_consumer
    depends_on:
      - kafka
      - postgres-app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres-app
      POSTGRES_DB: wikidata
      POSTGRES_USER: wikiuser
      POSTGRES_PASSWORD: wikipass
    restart: unless-stopped

  # --- App Postgres (Bronze layer for now) ---
  postgres-app:
    image: postgres:16
    environment:
      POSTGRES_DB: wikidata
      POSTGRES_USER: wikiuser
      POSTGRES_PASSWORD: wikipass
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
      - ./postgres_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikiuser -d wikidata"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_app_data:
